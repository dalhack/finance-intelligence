name: Single TestFlight IPA Upload

on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: 'GitHub Artifact ID of the signed release IPA'
        required: true
        default: '9142734363'
      expected_source_sha:
        description: 'Expected canonical source commit SHA for preflight'
        required: true
        default: '837e5a3f91cb0191a9f1ada9a7cc2c7afeb6fe81'

jobs:
  upload-testflight:
    name: Upload Signed IPA to App Store Connect TestFlight
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Preflight Workflow Checkout & Artifact Provenance Validation
        run: |
          CHECKOUT_SHA=$(git rev-parse HEAD)
          EXPECTED_SOURCE_SHA="${{ github.event.inputs.expected_source_sha }}"
          echo "Checked out Workflow SHA: $CHECKOUT_SHA"
          echo "Expected Artifact Source SHA: $EXPECTED_SOURCE_SHA"
          
          if [ ! -f ".github/workflows/upload-ios-testflight.yml" ]; then
            echo "CRITICAL FAIL-CLOSED: Upload workflow file missing in checked out source!"
            exit 1
          fi
          echo "Workflow checkout validation PASSED."

      - name: Download Signed IPA Artifact from GitHub
        run: |
          ARTIFACT_ID="${{ github.event.inputs.artifact_id }}"
          DOWNLOAD_URL="https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${ARTIFACT_ID}/zip"
          echo "Downloading artifact ID ${ARTIFACT_ID}..."
          
          mkdir -p $RUNNER_TEMP/artifact_download
          curl -sL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "$DOWNLOAD_URL" -o $RUNNER_TEMP/artifact_download/artifact.zip
          
          cd $RUNNER_TEMP/artifact_download
          unzip -q artifact.zip
          
          IPA_PATH=$(find . -name "*.ipa" | head -n 1)
          if [ -z "$IPA_PATH" ] || [ ! -f "$IPA_PATH" ]; then
            echo "CRITICAL FAIL-CLOSED: Downloaded artifact does not contain a valid .ipa file!"
            exit 1
          fi
          IPA_SIZE=$(wc -c < "$IPA_PATH")
          echo "IPA Artifact Downloaded: $IPA_PATH (Size: $IPA_SIZE bytes)"
          if [ "$IPA_SIZE" -lt 1000000 ]; then
            echo "CRITICAL FAIL-CLOSED: Downloaded IPA file size is invalid ($IPA_SIZE bytes)!"
            exit 1
          fi
          
          cp "$IPA_PATH" $RUNNER_TEMP/finance-intelligence-release.ipa
          echo "IPA Artifact verification and staging PASSED."

      - name: Setup App Store Connect API Key & Upload to TestFlight
        run: |
          KEY_ID="${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}"
          ISSUER_ID="${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}"
          
          if [ -z "$KEY_ID" ] || [ -z "$ISSUER_ID" ]; then
            echo "CRITICAL FAIL-CLOSED: App Store Connect API Key ID or Issuer ID secret is missing!"
            exit 1
          fi
          
          mkdir -p ~/.private_keys
          echo "${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}" | base64 --decode > ~/.private_keys/AuthKey_${KEY_ID}.p8
          
          IPA_FILE=$RUNNER_TEMP/finance-intelligence-release.ipa
          echo "Uploading $IPA_FILE to App Store Connect / TestFlight..."
          
          xcrun altool --upload-app \
            -f "$IPA_FILE" \
            --type ios \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"
            
          echo "TestFlight IPA upload completed successfully."

      - name: Cleanup API Private Keys & IPA Files
        if: always()
        run: |
          rm -rf ~/.private_keys/AuthKey_*.p8
          rm -rf $RUNNER_TEMP/artifact_download $RUNNER_TEMP/*.ipa
          echo "Temporary API private keys and IPA artifacts cleaned up successfully."
