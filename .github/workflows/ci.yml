name: Finance Intelligence CI Pipeline

on:
  workflow_dispatch:
    inputs:
      validation_scope:
        description: 'Validation Scope (ios_only or all)'
        required: true
        default: 'ios_only'
        type: choice
        options:
          - ios_only
          - all

jobs:
  boundary-and-secret:
    name: Boundary & Secret Scanner
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: pip install -r requirements.lock
      - name: Run Secret & Boundary Scanner
        run: pytest tests/unit/test_secret_scanner.py

  python-static:
    name: Python Lint & Type Check
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: pip install -r requirements.lock
      - name: Ruff Check
        run: ruff check . --extend-exclude="apps/mobile/ios/Flutter/ephemeral"
      - name: Ruff Format Check
        run: ruff format --check . --extend-exclude="apps/mobile/ios/Flutter/ephemeral"
      - name: MyPy Type Check
        run: mypy .

  python-unit-contract:
    name: Python Unit & Contract Tests
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: pip install -r requirements.lock
      - name: Run Python Unit Suite with JUnit XML Output
        run: pytest tests/unit --junitxml=pytest-unit-report.xml
      - name: Real Zero-Skip XML Machine Verification
        run: |
          python -c "import xml.etree.ElementTree as ET; tree = ET.parse('pytest-unit-report.xml'); root = tree.getroot(); suite = root if root.tag == 'testsuite' else root.find('testsuite'); skips = int(suite.attrib.get('skipped', 0)); fails = int(suite.attrib.get('failures', 0)) + int(suite.attrib.get('errors', 0)); total = int(suite.attrib.get('tests', 0)); print(f'Pytest Unit Results: total={total}, passed={total-skips-fails}, skipped={skips}, failed={fails}'); assert total > 0, 'No unit tests executed!'; assert skips == 0, f'CRITICAL: {skips} skipped tests found!'; assert fails == 0, f'CRITICAL: {fails} failed tests found!'"

  backend-foundation-gate:
    name: PostgreSQL Integration Suite
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: owner_pass
          POSTGRES_USER: db_owner
          POSTGRES_DB: finance_intelligence_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: pip install -r requirements.lock
      - name: Provision Roles via Canonical Single Source Script
        run: python scripts/provision_ci_roles.py --target-url "postgresql://db_owner:owner_pass@localhost:5432/finance_intelligence_test"
      - name: Provision Test Database
        run: PGPASSWORD=owner_pass psql -h localhost -U db_owner -d finance_intelligence_test -c "CREATE DATABASE finance_intelligence_roundtrip_test OWNER db_owner;" || true
      - name: Run Alembic Upgrade
        env:
          DATABASE_URL: "postgresql+asyncpg://db_owner:owner_pass@localhost:5432/finance_intelligence_test"
        run: alembic -c services/api/alembic.ini upgrade head
      - name: Run Integration Tests with JUnit XML Output
        env:
          TEST_OWNER_DATABASE_URL: "postgresql+asyncpg://db_owner:owner_pass@localhost:5432/finance_intelligence_test"
          TEST_BOOTSTRAP_DATABASE_URL: "postgresql+asyncpg://db_bootstrap:bootstrap_pass@localhost:5432/finance_intelligence_test"
          TEST_API_DATABASE_URL: "postgresql+asyncpg://db_api_user:api_pass@localhost:5432/finance_intelligence_test"
          TEST_WORKER_DATABASE_URL: "postgresql+asyncpg://db_ingestion_worker:worker_pass@localhost:5432/finance_intelligence_test"
          TEST_ROUNDTRIP_DATABASE_URL: "postgresql+asyncpg://db_owner:owner_pass@localhost:5432/finance_intelligence_roundtrip_test"
          TEST_MAINTENANCE_DATABASE_URL: "postgresql+asyncpg://db_maintenance_worker:dev_maintenance_pass_123@localhost:5432/finance_intelligence_test"
        run: pytest tests/integration --junitxml=pytest-integration-report.xml
      - name: Real Zero-Skip Integration XML Machine Verification
        run: |
          python -c "import xml.etree.ElementTree as ET; tree = ET.parse('pytest-integration-report.xml'); root = tree.getroot(); suite = root if root.tag == 'testsuite' else root.find('testsuite'); skips = int(suite.attrib.get('skipped', 0)); fails = int(suite.attrib.get('failures', 0)) + int(suite.attrib.get('errors', 0)); total = int(suite.attrib.get('tests', 0)); print(f'Pytest Integration Results: total={total}, passed={total-skips-fails}, skipped={skips}, failed={fails}'); assert total > 0, 'No integration tests executed!'; assert skips == 0, f'CRITICAL: {skips} skipped tests found!'; assert fails == 0, f'CRITICAL: {fails} failed tests found!'"

  mobile-gate:
    name: Flutter Analyze & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.8'
      - name: Install locked dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Flutter Format Check
        working-directory: apps/mobile
        run: dart format --output=none --set-exit-if-changed .
      - name: Flutter Analyze
        working-directory: apps/mobile
        run: flutter analyze

  flutter-machine-tests:
    name: Flutter Machine Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.8'
      - name: Install locked dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Run Flutter Machine Test Suite
        working-directory: apps/mobile
        run: flutter test --machine > flutter_test_report.jsonl
      - name: Real Flutter Machine Manifest Verification
        run: python scripts/parse_flutter_machine_output.py apps/mobile/flutter_test_report.jsonl

  migration-roundtrip:
    name: Migration Round-Trip Verification
    needs: backend-foundation-gate
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: owner_pass
          POSTGRES_USER: db_owner
          POSTGRES_DB: finance_intelligence_roundtrip
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: pip install -r requirements.lock
      - name: Provision Roles via Canonical Single Source Script
        run: python scripts/provision_ci_roles.py --target-url "postgresql://db_owner:owner_pass@localhost:5433/finance_intelligence_roundtrip"
      - name: Run Migration Upgrade, Revision Check, and Roundtrip
        env:
          DATABASE_URL: "postgresql+asyncpg://db_owner:owner_pass@localhost:5433/finance_intelligence_roundtrip"
        run: |
          alembic -c services/api/alembic.ini upgrade head
          alembic -c services/api/alembic.ini current
          alembic -c services/api/alembic.ini downgrade base
          alembic -c services/api/alembic.ini upgrade head

  security-catalog:
    name: Security Catalog Verification
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: owner_pass
          POSTGRES_USER: db_owner
          POSTGRES_DB: finance_intelligence_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: pip install -r requirements.lock
      - name: Provision Roles via Canonical Single Source Script
        run: python scripts/provision_ci_roles.py --target-url "postgresql://db_owner:owner_pass@localhost:5432/finance_intelligence_test"
      - name: Run Alembic Upgrade
        env:
          DATABASE_URL: "postgresql+asyncpg://db_owner:owner_pass@localhost:5432/finance_intelligence_test"
        run: alembic -c services/api/alembic.ini upgrade head
      - name: Run Genuine Security & RLS Suite
        env:
          TEST_OWNER_DATABASE_URL: "postgresql+asyncpg://db_owner:owner_pass@localhost:5432/finance_intelligence_test"
          TEST_BOOTSTRAP_DATABASE_URL: "postgresql+asyncpg://db_bootstrap:bootstrap_pass@localhost:5432/finance_intelligence_test"
          TEST_API_DATABASE_URL: "postgresql+asyncpg://db_api_user:api_pass@localhost:5432/finance_intelligence_test"
          TEST_WORKER_DATABASE_URL: "postgresql+asyncpg://db_ingestion_worker:worker_pass@localhost:5432/finance_intelligence_test"
          TEST_MAINTENANCE_DATABASE_URL: "postgresql+asyncpg://db_maintenance_worker:dev_maintenance_pass_123@localhost:5432/finance_intelligence_test"
        run: pytest tests/unit/test_security_pipeline.py tests/unit/test_security.py tests/unit/test_tenant_context_scanner.py tests/unit/test_secret_scanner.py

  contract-drift:
    name: OpenAPI Contract Drift
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.8'
      - name: Install locked dependencies
        run: pip install -r requirements.lock
      - name: Export OpenAPI Spec & Check Drift
        run: |
          python scripts/export_openapi.py
          git diff --exit-code contracts/openapi_spec.json
      - name: Run Flutter Contract Drift Test
        working-directory: apps/mobile
        run: |
          flutter pub get
          flutter test test/contract/contract_drift_test.dart

  traceability:
    name: Traceability Assertion Check
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: pip install -r requirements.lock
      - name: Run Traceability Validator
        run: pytest tests/unit/test_ai_orchestration.py

  android-build-preflight:
    name: Android Build Preflight
    if: inputs.validation_scope == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.8'
      - name: Check Android Toolchain
        run: flutter doctor -v

  ios-build-and-simulator-e2e:
    name: iOS Build & Simulator E2E Execution
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.8'
      - name: Check iOS Toolchain & Xcode
        run: |
          flutter doctor -v
          xcodebuild -version
      - name: Build iOS Simulator Bundle
        working-directory: apps/mobile
        run: |
          flutter pub get
          flutter build ios --simulator --no-codesign
      - name: Validate Runner.app Filesystem Artifact & Fingerprint
        working-directory: apps/mobile
        run: |
          test -d build/ios/iphonesimulator/Runner.app
          test -f build/ios/iphonesimulator/Runner.app/Info.plist
          test -f build/ios/iphonesimulator/Runner.app/Runner
          SIZE=$(du -s build/ios/iphonesimulator/Runner.app/Runner | cut -f1)
          echo "Runner.app Executable Byte Size: $SIZE"
          test "$SIZE" -gt 0
          shasum -a 256 build/ios/iphonesimulator/Runner.app/Runner build/ios/iphonesimulator/Runner.app/Info.plist
      - name: Create Dedicated Simulator Device & Persist UDID
        run: |
          xcrun simctl list runtimes
          SIM_UDID=$(xcrun simctl create "CI_Runner_${{ github.run_id }}_${{ github.run_attempt }}" "com.apple.CoreSimulator.SimDeviceType.iPhone-15")
          echo "Created Dedicated Simulator UDID: $SIM_UDID"
          test -n "$SIM_UDID"
          echo "SIMULATOR_UDID=$SIM_UDID" >> "$GITHUB_ENV"
      - name: Boot Simulator & Run Device E2E Target Test
        working-directory: apps/mobile
        run: |
          xcrun simctl boot "$SIMULATOR_UDID"
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          flutter devices
          flutter test integration_test/device_e2e_test.dart -d "$SIMULATOR_UDID"
      - name: Simulator Teardown & Cleanup
        if: always()
        run: |
          if [ -n "$SIMULATOR_UDID" ]; then
            echo "Shutting down and deleting dedicated CI simulator $SIMULATOR_UDID..."
            xcrun simctl shutdown "$SIMULATOR_UDID" || true
            xcrun simctl delete "$SIMULATOR_UDID" || true
          fi

  final-gate-summary:
    name: Final Quality Gate Summary
    if: always()
    needs:
      - boundary-and-secret
      - python-static
      - python-unit-contract
      - backend-foundation-gate
      - migration-roundtrip
      - security-catalog
      - mobile-gate
      - flutter-machine-tests
      - contract-drift
      - traceability
      - ios-build-and-simulator-e2e
    runs-on: ubuntu-latest
    steps:
      - name: Quality Gate Status Enforcement
        run: |
          echo "Enforcing strict success on all required upstream jobs..."
          for RES in "${{ needs.boundary-and-secret.result }}" \
                     "${{ needs.python-static.result }}" \
                     "${{ needs.python-unit-contract.result }}" \
                     "${{ needs.backend-foundation-gate.result }}" \
                     "${{ needs.migration-roundtrip.result }}" \
                     "${{ needs.security-catalog.result }}" \
                     "${{ needs.mobile-gate.result }}" \
                     "${{ needs.flutter-machine-tests.result }}" \
                     "${{ needs.contract-drift.result }}" \
                     "${{ needs.traceability.result }}" \
                     "${{ needs.ios-build-and-simulator-e2e.result }}"; do
            if [[ "$RES" != "success" ]]; then
              echo "CRITICAL FAIL-CLOSED: Upstream job result is '$RES' (not success)!"
              exit 1
            fi
          done
          echo "ALL REQUIRED QUALITY GATES PASSED CLEANLY WITH SUCCESS!"
