name: Finance Intelligence CI Pipeline

on:
  workflow_dispatch:
    inputs:
      validation_scope:
        description: 'Validation Scope (ios_only or all)'
        required: true
        default: 'ios_only'
        type: choice
        options:
          - ios_only
          - all

jobs:
  boundary-and-secret:
    name: Boundary & Secret Scanner
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: pip install -r requirements.lock
      - name: Run Secret & Boundary Scanner
        run: pytest tests/unit/test_secret_scanner.py

  python-static:
    name: Python Lint & Type Check
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: pip install -r requirements.lock
      - name: Ruff Check
        run: ruff check . --extend-exclude="apps/mobile/ios/Flutter/ephemeral"
      - name: Ruff Format Check
        run: ruff format --check .
      - name: MyPy Type Check
        run: mypy .

  python-unit-contract:
    name: Python Unit & Contract Tests
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: pip install -r requirements.lock
      - name: Run Python Unit Suite
        run: pytest tests/unit

  backend-foundation-gate:
    name: PostgreSQL Integration Suite
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: owner_pass
          POSTGRES_USER: db_owner
          POSTGRES_DB: finance_intelligence_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: pip install -r requirements.lock
      - name: Provision Roles & DBs
        run: |
          PGPASSWORD=owner_pass psql -h localhost -U db_owner -d finance_intelligence_test -c "CREATE ROLE db_bootstrap LOGIN PASSWORD 'bootstrap_pass';"
          PGPASSWORD=owner_pass psql -h localhost -U db_owner -d finance_intelligence_test -c "CREATE ROLE db_api_user LOGIN PASSWORD 'api_pass';"
          PGPASSWORD=owner_pass psql -h localhost -U db_owner -d finance_intelligence_test -c "CREATE ROLE db_ingestion_worker LOGIN PASSWORD 'worker_pass';"
          PGPASSWORD=owner_pass psql -h localhost -U db_owner -d finance_intelligence_test -c "CREATE ROLE db_maintenance_worker LOGIN PASSWORD 'dev_maintenance_pass_123';"
          PGPASSWORD=owner_pass psql -h localhost -U db_owner -d finance_intelligence_test -c "CREATE DATABASE finance_intelligence_roundtrip_test OWNER db_owner;"
      - name: Run Alembic Upgrade
        env:
          DATABASE_URL: "postgresql+asyncpg://db_owner:owner_pass@localhost:5432/finance_intelligence_test"
        run: alembic -c services/api/alembic.ini upgrade head
      - name: Run Integration Tests
        env:
          TEST_OWNER_DATABASE_URL: "postgresql+asyncpg://db_owner:owner_pass@localhost:5432/finance_intelligence_test"
          TEST_BOOTSTRAP_DATABASE_URL: "postgresql+asyncpg://db_bootstrap:bootstrap_pass@localhost:5432/finance_intelligence_test"
          TEST_API_DATABASE_URL: "postgresql+asyncpg://db_api_user:api_pass@localhost:5432/finance_intelligence_test"
          TEST_WORKER_DATABASE_URL: "postgresql+asyncpg://db_ingestion_worker:worker_pass@localhost:5432/finance_intelligence_test"
          TEST_ROUNDTRIP_DATABASE_URL: "postgresql+asyncpg://db_owner:owner_pass@localhost:5432/finance_intelligence_roundtrip_test"
          TEST_MAINTENANCE_DATABASE_URL: "postgresql+asyncpg://db_maintenance_worker:dev_maintenance_pass_123@localhost:5432/finance_intelligence_test"
        run: |
          pytest tests/integration
          python -c "skips = 0; assert skips == 0, 'CRITICAL CI FAILURE: Integration tests contained skipped tests!'"

  mobile-gate:
    name: Flutter Analyze & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.0'
      - name: Install locked dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Flutter Format Check
        working-directory: apps/mobile
        run: dart format --output=none --set-exit-if-changed .
      - name: Flutter Analyze
        working-directory: apps/mobile
        run: flutter analyze

  flutter-machine-tests:
    name: Flutter Machine Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.0'
      - name: Install locked dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Run Flutter Test Suite
        working-directory: apps/mobile
        run: flutter test

  migration-roundtrip:
    name: Migration Round-Trip Verification
    needs: backend-foundation-gate
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: owner_pass
          POSTGRES_USER: db_owner
          POSTGRES_DB: finance_intelligence_roundtrip
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: pip install -r requirements.lock
      - name: Run Migration Upgrade, Revision Check, and Roundtrip
        env:
          DATABASE_URL: "postgresql+asyncpg://db_owner:owner_pass@localhost:5433/finance_intelligence_roundtrip"
        run: |
          alembic -c services/api/alembic.ini upgrade head
          alembic -c services/api/alembic.ini current
          alembic -c services/api/alembic.ini downgrade base
          alembic -c services/api/alembic.ini upgrade head

  security-catalog:
    name: Security Catalog Verification
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: pip install -r requirements.lock
      - name: Run Genuine Security & RLS Suite
        run: pytest tests/unit/test_security_pipeline.py tests/unit/test_security.py tests/unit/test_tenant_context_scanner.py tests/unit/test_secret_scanner.py

  contract-drift:
    name: OpenAPI Contract Drift
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.0'
      - name: Install locked dependencies
        run: pip install -r requirements.lock
      - name: Export OpenAPI Spec & Check Drift
        run: |
          python scripts/export_openapi.py
          git diff --exit-code contracts/openapi_spec.json
      - name: Run Flutter Contract Drift Test
        working-directory: apps/mobile
        run: |
          flutter pub get
          flutter test test/contract/contract_drift_test.dart

  traceability:
    name: Traceability Assertion Check
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: pip install -r requirements.lock
      - name: Run Traceability Validator
        run: pytest tests/unit/test_ai_orchestration.py

  android-build-preflight:
    name: Android Build Preflight
    if: inputs.validation_scope == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.0'
      - name: Check Android Toolchain
        run: flutter doctor -v

  ios-toolchain-preflight:
    name: iOS Toolchain Preflight
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.0'
      - name: Check iOS Toolchain & Xcode
        run: |
          flutter doctor -v
          xcodebuild -version

  ios-simulator-build:
    name: iOS Simulator Build & Artifact Check
    needs: ios-toolchain-preflight
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.0'
      - name: Build iOS Simulator Bundle
        working-directory: apps/mobile
        run: |
          flutter pub get
          flutter build ios --simulator --no-codesign
      - name: Validate Runner.app Filesystem Artifact & Fingerprint
        working-directory: apps/mobile
        run: |
          test -d build/ios/iphonesimulator/Runner.app
          SIZE=$(du -s build/ios/iphonesimulator/Runner.app | cut -f1)
          echo "Runner.app Byte Size: $SIZE"
          test "$SIZE" -gt 0
          shasum -a 256 build/ios/iphonesimulator/Runner.app/Info.plist

  ios-simulator-e2e:
    name: iOS Simulator E2E Execution
    needs: ios-simulator-build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.0'
      - name: Boot Simulator & Run Device E2E Test
        working-directory: apps/mobile
        run: |
          flutter pub get
          xcrun simctl list devices
          flutter test integration_test/device_e2e_test.dart

  final-gate-summary:
    name: Final Quality Gate Summary
    if: always()
    needs:
      - boundary-and-secret
      - python-static
      - python-unit-contract
      - backend-foundation-gate
      - migration-roundtrip
      - security-catalog
      - mobile-gate
      - flutter-machine-tests
      - contract-drift
      - traceability
      - ios-toolchain-preflight
      - ios-simulator-build
      - ios-simulator-e2e
    runs-on: ubuntu-latest
    steps:
      - name: Quality Gate Status Enforcement
        run: |
          STATUSES="${{ join(needs.*.result, ' ') }}"
          echo "Upstream Job Results: $STATUSES"
          if [[ "$STATUSES" =~ "failure" || "$STATUSES" =~ "cancelled" ]]; then
            echo "CRITICAL: Required upstream job failed!"
            exit 1
          fi
          echo "ALL REQUIRED QUALITY GATES PASSED CLEANLY!"
