name: Validate Migration Lock Parity (Install-Only)

on:
  workflow_dispatch:
    inputs:
      expected_commit_sha:
        description: 'Authorized Git Commit SHA to checkout and validate'
        required: true
        type: string

concurrency:
  group: validate-migration-lock-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-lock:
    name: Validate Migration Lock Parity (Install-Only)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Validate Ref and Input SHA Format
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${{ inputs.expected_commit_sha }}" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::Invalid input commit SHA format: ${{ inputs.expected_commit_sha }}"
            exit 1
          fi

      - name: Checkout Code at Authorized Commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.expected_commit_sha }}
          persist-credentials: false

      - name: Verify Checked-out Commit Identity
        shell: bash
        run: |
          set -euo pipefail
          CHECKED_OUT_SHA=$(git rev-parse HEAD)
          echo "Checked out SHA: ${CHECKED_OUT_SHA}"
          echo "Expected SHA:    ${{ inputs.expected_commit_sha }}"
          if [ "${CHECKED_OUT_SHA}" != "${{ inputs.expected_commit_sha }}" ]; then
            echo "::error::Checked-out SHA does not match authorized expected_commit_sha!"
            exit 1
          fi

      - name: Validate Pip Hash Installation in Ephemeral Pinned Container
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${PWD}:/app:ro" \
            --workdir /app \
            python:3.11-slim@sha256:00af38ae2ed311628970782e8a2d7f014d8909dbc63cb97bc0a158187f4db045 \
            sh -c "python -m pip install --no-cache-dir --require-hashes -r /app/services/api/requirements-migration.lock && python -m pip check"

      - name: Run Import Smoke Test in Ephemeral Pinned Container
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${PWD}:/app:ro" \
            --workdir /app \
            python:3.11-slim@sha256:00af38ae2ed311628970782e8a2d7f014d8909dbc63cb97bc0a158187f4db045 \
            sh -c "python -m pip install --no-cache-dir --require-hashes -r /app/services/api/requirements-migration.lock >/dev/null 2>&1 && python -c 'import alembic; import sqlalchemy; import google.cloud.secretmanager; import pg8000; import cryptography; import cffi; import pycparser; import scramp; print(\"[IMPORT_SMOKE_TEST] SUCCESS: All 9 core migration modules imported cleanly.\")'"
