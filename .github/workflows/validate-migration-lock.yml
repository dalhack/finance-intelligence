name: Validate Migration Lock Parity (Install-Only)

on:
  workflow_dispatch:
    inputs:
      expected_commit_sha:
        description: 'Authorized Git Commit SHA to checkout and validate'
        required: true
        type: string

concurrency:
  group: validate-migration-lock-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-lock:
    name: Validate Migration Lock Parity (Install-Only)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Validate Ref and Input SHA Format
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/finance-intelligence/phase-4c2c-ios-ci-validation" ]; then
            echo "::error::Unauthorized target ref: ${GITHUB_REF}"
            exit 1
          fi
          if [[ ! "${{ inputs.expected_commit_sha }}" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::Invalid input commit SHA format: ${{ inputs.expected_commit_sha }}"
            exit 1
          fi

      - name: Checkout Code at Authorized Commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.expected_commit_sha }}
          persist-credentials: false

      - name: Verify Checked-out Commit Identity Parity
        shell: bash
        run: |
          set -euo pipefail
          CHECKED_OUT_SHA=$(git rev-parse HEAD)
          echo "Checked out SHA: ${CHECKED_OUT_SHA}"
          echo "Context SHA:     ${GITHUB_SHA}"
          echo "Expected SHA:    ${{ inputs.expected_commit_sha }}"
          if [ "${CHECKED_OUT_SHA}" != "${{ inputs.expected_commit_sha }}" ]; then
            echo "::error::Checked-out SHA does not match authorized expected_commit_sha!"
            exit 1
          fi
          if [ "${GITHUB_SHA}" != "${{ inputs.expected_commit_sha }}" ]; then
            echo "::error::GitHub context SHA does not match authorized expected_commit_sha!"
            exit 1
          fi

      - name: Pull Base Image and Assert Platform Architecture
        shell: bash
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 python:3.11-slim@sha256:00af38ae2ed311628970782e8a2d7f014d8909dbc63cb97bc0a158187f4db045
          PLATFORM_ARCH=$(docker image inspect --format '{{.Architecture}}/{{.Os}}' python:3.11-slim@sha256:00af38ae2ed311628970782e8a2d7f014d8909dbc63cb97bc0a158187f4db045)
          echo "Base Image Digest Architecture: ${PLATFORM_ARCH}"
          if [ "${PLATFORM_ARCH}" != "amd64/linux" ]; then
            echo "::error::Unexpected base image platform: ${PLATFORM_ARCH}"
            exit 1
          fi

      - name: Stage A - Create Volume and Install Lock Dependencies
        shell: bash
        run: |
          set -euo pipefail
          VALIDATION_VOLUME="fi-migration-lock-validation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          if docker volume inspect "${VALIDATION_VOLUME}" >/dev/null 2>&1; then
            echo "::error::Validation volume unexpectedly already exists before creation!"
            exit 1
          fi

          docker volume create "${VALIDATION_VOLUME}" >/dev/null

          docker run --rm \
            --platform linux/amd64 \
            -v "${PWD}:/app:ro" \
            -v "${VALIDATION_VOLUME}:/validation-venv" \
            --workdir /app \
            python:3.11-slim@sha256:00af38ae2ed311628970782e8a2d7f014d8909dbc63cb97bc0a158187f4db045 \
            sh -c "python -m venv /validation-venv && /validation-venv/bin/python -m pip install --no-cache-dir --require-hashes -r /app/services/api/requirements-migration.lock && /validation-venv/bin/python -m pip check"

          if ! docker volume inspect "${VALIDATION_VOLUME}" >/dev/null 2>&1; then
            echo "::error::Validation volume was lost after Stage A installation!"
            exit 1
          fi

      - name: Stage B - Run Import Smoke Test in Network-Disabled Container
        shell: bash
        run: |
          set -euo pipefail
          VALIDATION_VOLUME="fi-migration-lock-validation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          if ! docker volume inspect "${VALIDATION_VOLUME}" >/dev/null 2>&1; then
            echo "::error::Validation volume missing before Stage B import smoke test!"
            exit 1
          fi

          docker run --rm \
            --platform linux/amd64 \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,noexec \
            --env PYTHONPATH=/app/services/api \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --env PYTHONUNBUFFERED=1 \
            -v "${PWD}/services/api:/app/services/api:ro" \
            -v "${VALIDATION_VOLUME}:/validation-venv:ro" \
            --workdir /app \
            python:3.11-slim@sha256:00af38ae2ed311628970782e8a2d7f014d8909dbc63cb97bc0a158187f4db045 \
            /validation-venv/bin/python -c "import alembic; import sqlalchemy; import google.cloud.sql.connector; import google.cloud.secretmanager; import google.auth; import pg8000; import cryptography; import cffi; import pycparser; import scramp; import app.migration_entrypoint; import app.migration_execution.config; import app.migration_execution.cloudsql_admin; import app.migration_execution.provisioning; import app.migration_execution.alembic_runner; import app.migration_execution.verification; import app.migration_execution.redaction; import app.migration_execution.compatibility; import app.migration_execution.compatibility.revision_024; import app.migration_execution.role_security; from app.migration_execution.compatibility.revision_024 import EXPECTED_REVISION_024_SHA256, SOURCE_REVISION, COMPATIBILITY_REVISION; from app.migration_execution.role_security import HARDENING_TARGET_ALLOWLIST, FORBIDDEN_TARGET_ROLES, EXPECTED_ADMIN_SESSION_USER, EXPECTED_POSTCONDITION_CONTRACT; assert EXPECTED_REVISION_024_SHA256 == '26077eb15b670e92b1d39c8e36093b7bf165a041f76463271d496054f2919d54'; assert SOURCE_REVISION == '023_analysis_clarification_workflow'; assert COMPATIBILITY_REVISION == '024_maintenance_scheduler_and_operational_resilience'; assert HARDENING_TARGET_ALLOWLIST == ('db_api_user', 'db_ingestion_worker', 'db_maintenance_worker', 'db_bootstrap'); assert len(HARDENING_TARGET_ALLOWLIST) == 4; assert HARDENING_TARGET_ALLOWLIST[-1] == 'db_bootstrap'; assert EXPECTED_ADMIN_SESSION_USER == 'postgres'; assert EXPECTED_POSTCONDITION_CONTRACT.rolcanlogin is True; assert EXPECTED_POSTCONDITION_CONTRACT.rolsuper is False; assert EXPECTED_POSTCONDITION_CONTRACT.rolcreaterole is False; assert EXPECTED_POSTCONDITION_CONTRACT.rolcreatedb is False; assert EXPECTED_POSTCONDITION_CONTRACT.rolbypassrls is False; assert EXPECTED_POSTCONDITION_CONTRACT.rolreplication is False; from importlib.metadata import version; from google.cloud.sql.connector import Connector; assert version('cloud-sql-python-connector') == '1.9.2'; assert callable(getattr(Connector, 'close', None)); print('[EXECUTION_PLANE_IMPORT_SMOKE] SUCCESS'); print('[REVISION_024_COMPATIBILITY_IMPORT] SUCCESS'); print(f'[REVISION_024_CHECKSUM_CONSTANT] {EXPECTED_REVISION_024_SHA256}'); print('[ROLE_SECURITY_IMPORT] SUCCESS'); print(f'[ROLE_HARDENING_TARGET_COUNT] {len(HARDENING_TARGET_ALLOWLIST)}'); print(f'[ROLE_HARDENING_LAST_TARGET] {HARDENING_TARGET_ALLOWLIST[-1]}'); print(f'[ROLE_HARDENING_ADMIN_SESSION] {EXPECTED_ADMIN_SESSION_USER}'); print('[ROLE_HARDENING_POSTCONDITION_CONTRACT] COMPLETE'); print('[CONNECTOR_VERSION] 1.9.2'); print('[CONNECTOR_CLOSE_API] PRESENT')"

      - name: Cleanup Exact Validation Volume
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          VALIDATION_VOLUME="fi-migration-lock-validation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker volume rm -f "${VALIDATION_VOLUME}" >/dev/null 2>&1 || true
          if docker volume inspect "${VALIDATION_VOLUME}" >/dev/null 2>&1; then
            echo "::error::Validation volume still exists after cleanup!"
            exit 1
          fi
          echo "[CLEANUP] Exact validation volume removed."
