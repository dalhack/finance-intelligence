name: Validate Migration Lock Parity (Install-Only)

on:
  workflow_dispatch:
    inputs:
      expected_commit_sha:
        description: 'Authorized Git Commit SHA to checkout and validate'
        required: true
        type: string

concurrency:
  group: validate-migration-lock-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-lock:
    name: Validate Migration Lock Parity (Install-Only)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Validate Ref and Input SHA Format
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/finance-intelligence/phase-4c2c-ios-ci-validation" ]; then
            echo "::error::Unauthorized target ref: ${GITHUB_REF}"
            exit 1
          fi
          if [[ ! "${{ inputs.expected_commit_sha }}" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::Invalid input commit SHA format: ${{ inputs.expected_commit_sha }}"
            exit 1
          fi

      - name: Checkout Code at Authorized Commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.expected_commit_sha }}
          persist-credentials: false

      - name: Verify Checked-out Commit Identity Parity
        shell: bash
        run: |
          set -euo pipefail
          CHECKED_OUT_SHA=$(git rev-parse HEAD)
          echo "Checked out SHA: ${CHECKED_OUT_SHA}"
          echo "Context SHA:     ${GITHUB_SHA}"
          echo "Expected SHA:    ${{ inputs.expected_commit_sha }}"
          if [ "${CHECKED_OUT_SHA}" != "${{ inputs.expected_commit_sha }}" ]; then
            echo "::error::Checked-out SHA does not match authorized expected_commit_sha!"
            exit 1
          fi
          if [ "${GITHUB_SHA}" != "${{ inputs.expected_commit_sha }}" ]; then
            echo "::error::GitHub context SHA does not match authorized expected_commit_sha!"
            exit 1
          fi

      - name: Pull Base Image and Assert Platform Architecture
        shell: bash
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 python:3.11-slim@sha256:00af38ae2ed311628970782e8a2d7f014d8909dbc63cb97bc0a158187f4db045
          PLATFORM_ARCH=$(docker image inspect --format '{{.Architecture}}/{{.Os}}' python:3.11-slim@sha256:00af38ae2ed311628970782e8a2d7f014d8909dbc63cb97bc0a158187f4db045)
          echo "Base Image Digest Architecture: ${PLATFORM_ARCH}"
          if [ "${PLATFORM_ARCH}" != "amd64/linux" ]; then
            echo "::error::Unexpected base image platform: ${PLATFORM_ARCH}"
            exit 1
          fi

      - name: Stage A - Create Volume and Install Lock Dependencies
        shell: bash
        run: |
          set -euo pipefail
          VALIDATION_VOLUME="fi-migration-lock-validation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          if docker volume inspect "${VALIDATION_VOLUME}" >/dev/null 2>&1; then
            echo "::error::Validation volume unexpectedly already exists before creation!"
            exit 1
          fi

          docker volume create "${VALIDATION_VOLUME}" >/dev/null

          docker run --rm \
            --platform linux/amd64 \
            -v "${PWD}:/app:ro" \
            -v "${VALIDATION_VOLUME}:/validation-venv" \
            --workdir /app \
            python:3.11-slim@sha256:00af38ae2ed311628970782e8a2d7f014d8909dbc63cb97bc0a158187f4db045 \
            sh -c "python -m venv /validation-venv && /validation-venv/bin/python -m pip install --no-cache-dir --require-hashes -r /app/services/api/requirements-migration.lock && /validation-venv/bin/python -m pip check"

          if ! docker volume inspect "${VALIDATION_VOLUME}" >/dev/null 2>&1; then
            echo "::error::Validation volume was lost after Stage A installation!"
            exit 1
          fi

      - name: Stage B - Run Import Smoke Test in Network-Disabled Container
        shell: bash
        run: |
          set -euo pipefail
          VALIDATION_VOLUME="fi-migration-lock-validation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          if ! docker volume inspect "${VALIDATION_VOLUME}" >/dev/null 2>&1; then
            echo "::error::Validation volume missing before Stage B import smoke test!"
            exit 1
          fi

          docker run --rm \
            --platform linux/amd64 \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,noexec \
            -v "${PWD}:/app:ro" \
            -v "${VALIDATION_VOLUME}:/validation-venv:ro" \
            --workdir /app \
            python:3.11-slim@sha256:00af38ae2ed311628970782e8a2d7f014d8909dbc63cb97bc0a158187f4db045 \
            /validation-venv/bin/python -c "import alembic; import sqlalchemy; import google.cloud.sql.connector; import google.cloud.secretmanager; import pg8000; import cryptography; import cffi; import pycparser; import scramp; print(\"[IMPORT_SMOKE_TEST] SUCCESS: All 9 core migration modules imported cleanly.\")"

      - name: Cleanup Exact Validation Volume
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          VALIDATION_VOLUME="fi-migration-lock-validation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker volume rm -f "${VALIDATION_VOLUME}" >/dev/null 2>&1 || true
          if docker volume inspect "${VALIDATION_VOLUME}" >/dev/null 2>&1; then
            echo "::error::Validation volume still exists after cleanup!"
            exit 1
          fi
          echo "[CLEANUP] Exact validation volume removed."
