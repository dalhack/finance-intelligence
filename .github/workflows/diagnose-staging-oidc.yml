name: Redacted OIDC Claim Diagnostics for Staging

on:
  workflow_dispatch:
    inputs:
      expected_commit_sha:
        description: Exact 40-character commit SHA authorized for OIDC claim diagnosis
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  diagnose-oidc-claims:
    name: Extract and Print Allowlisted OIDC Claims
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    steps:
      - name: Validate Ref and Input SHA Format
        run: |
          if [ "${{ github.ref }}" != "refs/heads/finance-intelligence/phase-4c2c-ios-ci-validation" ]; then
            echo "ERROR: Workflow can only be dispatched from finance-intelligence/phase-4c2c-ios-ci-validation"
            exit 1
          fi

          COMMIT_INPUT="${{ inputs.expected_commit_sha }}"
          if [[ ! "${COMMIT_INPUT}" =~ ^[a-f0-9]{40}$ ]]; then
            echo "ERROR: Input expected_commit_sha must be an exact 40-character lowercase hex string."
            exit 1
          fi

      - name: Checkout Code at Authorized Commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.expected_commit_sha }}
          persist-credentials: false

      - name: Verify Checked-out Commit Identity
        run: |
          CHECKED_OUT_HEAD=$(git rev-parse HEAD)
          EXPECTED_SHA="${{ inputs.expected_commit_sha }}"

          echo "Checked-out HEAD: ${CHECKED_OUT_HEAD}"
          echo "Expected Input SHA: ${EXPECTED_SHA}"

          if [ "${CHECKED_OUT_HEAD}" != "${EXPECTED_SHA}" ]; then
            echo "ERROR: Checked-out HEAD '${CHECKED_OUT_HEAD}' does not match expected input SHA '${EXPECTED_SHA}'"
            exit 1
          fi

      - name: Decode and Print Allowlisted OIDC Claims
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const ALLOWLISTED_CLAIMS = [
              "iss",
              "aud",
              "sub",
              "repository",
              "repository_id",
              "repository_owner",
              "repository_owner_id",
              "ref",
              "ref_type",
              "environment",
              "workflow",
              "workflow_ref",
              "job_workflow_ref",
              "sha",
              "event_name",
              "actor_id",
              "runner_environment"
            ];

            const audience = "https://iam.googleapis.com/projects/523958262212/locations/global/workloadIdentityPools/github-actions-pool/providers/github-oidc-provider";
            const token = await core.getIDToken(audience);
            
            if (!token) {
              core.setFailed("Failed to acquire OIDC token from GitHub Actions runner.");
              return;
            }

            const parts = token.split('.');
            if (parts.length !== 3) {
              core.setFailed("Invalid JWT token format retrieved.");
              return;
            }

            const payloadBuf = Buffer.from(parts[1], 'base64');
            const payload = JSON.parse(payloadBuf.toString('utf8'));

            const extractedClaims = {};
            console.log("=== BEGIN ALLOWLISTED OIDC CLAIMS ===");
            for (const key of ALLOWLISTED_CLAIMS) {
              if (Object.prototype.hasOwnProperty.call(payload, key)) {
                extractedClaims[key] = payload[key];
                console.log(`${key}: ${JSON.stringify(payload[key])}`);
              } else {
                extractedClaims[key] = "CLAIM_ABSENT";
                console.log(`${key}: CLAIM_ABSENT`);
              }
            }
            console.log("=== END ALLOWLISTED OIDC CLAIMS ===");

            const crypto = require('crypto');
            const sortedJson = JSON.stringify(extractedClaims, Object.keys(extractedClaims).sort());
            const fingerprint = crypto.createHash('sha256').update(sortedJson).digest('hex');
            console.log(`ALLOWLISTED_CLAIMS_FINGERPRINT=sha256:${fingerprint}`);
