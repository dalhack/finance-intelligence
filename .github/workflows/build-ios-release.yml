name: Build Signed iOS App Store Release Package

on:
  workflow_dispatch:
    inputs:
      expected_commit_sha:
        description: 'Expected canonical commit SHA for preflight identity validation'
        required: true
        default: '2d444028975a0c772b5cf08a24d3286205206c14'

jobs:
  build-ios-signed-release:
    name: Build & Export Signed iOS IPA Package
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check iOS Toolchain & Xcode 16 SDK Version
        run: |
          xcodebuild -version
          XCODE_VER=$(xcodebuild -version | head -n 1 | awk '{print $2}')
          SDK_VER=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "Observed Xcode Version: $XCODE_VER"
          echo "Observed iPhoneOS SDK Version: $SDK_VER"
          
          XCODE_MAJOR=$(echo "$XCODE_VER" | cut -d. -f1)
          SDK_MAJOR=$(echo "$SDK_VER" | cut -d. -f1)
          
          if [ "$XCODE_MAJOR" -lt 16 ]; then
            echo "CRITICAL FAIL-CLOSED: Xcode major version ($XCODE_MAJOR) is less than required 16!"
            exit 1
          fi
          if [ "$SDK_MAJOR" -lt 18 ]; then
            echo "CRITICAL FAIL-CLOSED: iPhoneOS SDK major version ($SDK_MAJOR) is less than required 18!"
            exit 1
          fi
          echo "Xcode 16 / iOS 18 SDK preflight PASSED."

      - name: Preflight Canonical SHA & Identity Validation
        run: |
          ACTUAL_SHA=$(git rev-parse HEAD)
          EXPECTED_SHA="${{ github.event.inputs.expected_commit_sha }}"
          echo "Checked out SHA: $ACTUAL_SHA"
          echo "Expected SHA:   $EXPECTED_SHA"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "CRITICAL FAIL-CLOSED: Checked out SHA does not match expected canonical SHA!"
            exit 1
          fi

          PBXPROJ="apps/mobile/ios/Runner.xcodeproj/project.pbxproj"
          if ! grep -q "PRODUCT_BUNDLE_IDENTIFIER = com.korhanturgut.financeintelligence;" "$PBXPROJ"; then
            echo "CRITICAL FAIL-CLOSED: iOS Bundle ID parity check failed!"
            exit 1
          fi
          if ! grep -q "DEVELOPMENT_TEAM = D7FNNBFRUV;" "$PBXPROJ"; then
            echo "CRITICAL FAIL-CLOSED: Apple Team ID parity check failed!"
            exit 1
          fi
          echo "Preflight canonical identity and SHA validation PASSED."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.8'
          cache: true

      - name: Install Mobile Dependencies
        run: |
          cd apps/mobile
          flutter pub get

      - name: Import Apple Distribution Certificate & Provisioning Profile
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build_signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          P12_PATH=$RUNNER_TEMP/cert.p12
          echo "${{ secrets.IOS_DISTRIBUTION_CERT_P12_BASE64 }}" | base64 --decode > "$P12_PATH"
          security import "$P12_PATH" -k "$KEYCHAIN_PATH" -P "${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}" -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          PROFILING_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILING_DIR"
          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          echo "${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}" | base64 --decode > "$PROFILE_PATH"

          PROFILE_NAME=$(security cms -D -i "$PROFILE_PATH" 2>/dev/null | grep -aA1 "<key>Name</key>" | grep string | sed -e 's/.*<string>//' -e 's/<\/string>.*//' || true)
          if [ -z "$PROFILE_NAME" ]; then
            PROFILE_NAME=$(grep -aA1 "<key>Name</key>" "$PROFILE_PATH" 2>/dev/null | grep string | sed -e 's/.*<string>//' -e 's/<\/string>.*//' || true)
          fi

          PROFILE_UUID=$(security cms -D -i "$PROFILE_PATH" 2>/dev/null | grep -aA1 "<key>UUID</key>" | grep string | sed -e 's/.*<string>//' -e 's/<\/string>.*//' || true)
          if [ -z "$PROFILE_UUID" ]; then
            PROFILE_UUID=$(grep -aA1 "<key>UUID</key>" "$PROFILE_PATH" 2>/dev/null | grep string | sed -e 's/.*<string>//' -e 's/<\/string>.*//' || true)
          fi

          if [ -z "$PROFILE_NAME" ] || [ -z "$PROFILE_UUID" ]; then
            echo "CRITICAL FAIL-CLOSED: Provisioning Profile Name or UUID could not be extracted!"
            exit 1
          fi

          echo "$PROFILE_NAME" > $RUNNER_TEMP/profile_name.txt
          echo "$PROFILE_UUID" > $RUNNER_TEMP/profile_uuid.txt

          cp "$PROFILE_PATH" "$PROFILING_DIR/$PROFILE_UUID.mobileprovision"
          echo "PROVISIONING_PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV
          echo "DISTRIBUTION_CERT_IMPORTED=true" >> $GITHUB_ENV
          echo "APP_STORE_PROFILE_INSTALLED=true" >> $GITHUB_ENV
          echo "Profile imported successfully with non-disclosed runtime UUID mapping."

      - name: Build & Export Signed iOS App Store IPA Package
        run: |
          cd apps/mobile

          flutter build ios --release --no-codesign --build-number=1 --build-name=1.0.0

          mkdir -p build/ios/archive
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/ios/archive/Runner.xcarchive \
            archive \
            PROVISIONING_PROFILE_UUID="$PROVISIONING_PROFILE_UUID"

          RUNTIME_PROFILE_NAME=$(cat $RUNNER_TEMP/profile_name.txt)
          RUNTIME_PLIST="$RUNNER_TEMP/RuntimeExportOptions.plist"

          cat <<EOF > "$RUNTIME_PLIST"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>method</key>
          	<string>app-store-connect</string>
          	<key>teamID</key>
          	<string>D7FNNBFRUV</string>
          	<key>signingStyle</key>
          	<string>manual</string>
          	<key>provisioningProfiles</key>
          	<dict>
          		<key>com.korhanturgut.financeintelligence</key>
          		<string>${RUNTIME_PROFILE_NAME}</string>
          	</dict>
          	<key>uploadSymbols</key>
          	<true/>
          </dict>
          </plist>
          EOF

          mkdir -p build/ios/ipa
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist "$RUNTIME_PLIST" \
            -exportPath build/ios/ipa

      - name: Verify Signed IPA Artifact
        run: |
          IPA_PATH=$(find apps/mobile/build/ios/ipa -name "*.ipa" | head -n 1)
          if [ -z "$IPA_PATH" ] || [ ! -f "$IPA_PATH" ]; then
            echo "CRITICAL FAIL-CLOSED: Signed .ipa package was not produced!"
            exit 1
          fi
          IPA_SIZE=$(wc -c < "$IPA_PATH")
          echo "Produced IPA Package: $IPA_PATH (Size: $IPA_SIZE bytes)"
          if [ "$IPA_SIZE" -lt 1000000 ]; then
            echo "CRITICAL FAIL-CLOSED: IPA file size too small ($IPA_SIZE bytes)!"
            exit 1
          fi
          echo "Signed IPA Package verification PASSED."

      - name: Upload Signed IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: finance-intelligence-ios-release-v1.0.0-b1
          path: apps/mobile/build/ios/ipa/*.ipa
          retention-days: 14

      - name: Cleanup Signing Assets & Keychains
        if: always()
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build_signing.keychain-db
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -rf $RUNNER_TEMP/*.p12 $RUNNER_TEMP/*.mobileprovision $RUNNER_TEMP/*.plist $RUNNER_TEMP/*.txt
          rm -rf "$HOME/Library/MobileDevice/Provisioning Profiles"/*
          echo "Temporary signing assets, keychains, and runtime export plists cleaned up successfully."
