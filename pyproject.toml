[project]
name = "finance-intelligence"
version = "0.1.0"
description = "Enterprise Financial Intelligence Monorepo Backbone"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.31.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.0",
    "firebase-admin>=6.5.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.4",
    "pypdf>=4.3.0",
    "chardet>=5.2.0",
    "filetype>=1.2.0",
    "anthropic>=0.120.2,<0.121.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.16.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests",
    "contract: Wire contract tests",
    "integration: PostgreSQL & RLS integration tests",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
namespace_packages = true
ignore_missing_imports = true
warn_return_any = false
warn_unused_configs = true
