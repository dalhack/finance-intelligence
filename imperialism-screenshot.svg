<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900">
  <defs>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b6a4a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5a3a20;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a8a4a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a5a2a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1400" height="900" fill="#2d1810"/>

  <!-- Wood Frame Outer -->
  <rect x="0" y="0" width="1400" height="900" fill="none" stroke="#8b6a4a" stroke-width="15"/>
  <rect x="15" y="15" width="1370" height="870" fill="none" stroke="#4a2a10" stroke-width="2"/>

  <!-- Status Bar -->
  <rect x="25" y="20" width="1350" height="40" fill="url(#woodGrad)" stroke="#3d2415" stroke-width="2"/>
  <text x="40" y="45" font-family="Times New Roman" font-size="14" font-weight="bold" fill="#daa">Fall, 1818</text>
  <text x="650" y="45" font-family="Times New Roman" font-size="14" font-weight="bold" fill="#daa" text-anchor="middle">Treasury: $21,143</text>
  <text x="1320" y="45" font-family="Times New Roman" font-size="14" font-weight="bold" fill="#daa" text-anchor="end">Great Britain</text>

  <!-- Map Area -->
  <rect x="25" y="70" width="1000" height="810" fill="#1a5030" stroke="#3d2415" stroke-width="3"/>

  <!-- Terrain Grid (simplified) -->
  <g id="map-content">
    <!-- Grassland tiles -->
    <rect x="35" y="80" width="20" height="20" fill="#3a7a3a" stroke="#0a0a0a" stroke-width="1"/>
    <rect x="55" y="80" width="20" height="20" fill="#2a5a2a" stroke="#0a0a0a" stroke-width="1"/>
    <rect x="75" y="80" width="20" height="20" fill="#3a7a3a" stroke="#0a0a0a" stroke-width="1"/>
    <rect x="95" y="80" width="20" height="20" fill="#1a4a1a" stroke="#0a0a0a" stroke-width="1"/>

    <!-- Mountain tiles -->
    <rect x="115" y="80" width="20" height="20" fill="#8a8a8a" stroke="#0a0a0a" stroke-width="1"/>
    <rect x="115" y="100" width="20" height="20" fill="#9a9a9a" stroke="#0a0a0a" stroke-width="1"/>

    <!-- Forest tiles -->
    <rect x="75" y="100" width="20" height="20" fill="#1a4a1a" stroke="#0a0a0a" stroke-width="1"/>
    <rect x="75" y="120" width="20" height="20" fill="#0a3a0a" stroke="#0a0a0a" stroke-width="1"/>

    <!-- Grassland fill -->
    <rect x="35" y="100" width="40" height="200" fill="#3a7a3a" stroke="#0a0a0a" stroke-width="1" opacity="0.7"/>
    <rect x="150" y="80" width="200" height="300" fill="#3a7a3a" stroke="#0a0a0a" stroke-width="1" opacity="0.6"/>
    <rect x="400" y="100" width="300" height="250" fill="#2a5a2a" stroke="#0a0a0a" stroke-width="1" opacity="0.5"/>

    <!-- Water -->
    <rect x="35" y="400" width="400" height="250" fill="#1a3a6a" stroke="#0a0a0a" stroke-width="1" opacity="0.8"/>
    <rect x="750" y="150" width="200" height="400" fill="#1a3a6a" stroke="#0a0a0a" stroke-width="1" opacity="0.7"/>
  </g>

  <!-- Province borders -->
  <line x1="150" y1="80" x2="150" y2="400" stroke="#4a7aff" stroke-width="2" opacity="0.6"/>
  <line x1="350" y1="100" x2="350" y2="350" stroke="#4a7aff" stroke-width="2" opacity="0.6"/>
  <line x1="750" y1="150" x2="750" y2="550" stroke="#cc3333" stroke-width="2" opacity="0.6"/>

  <!-- Units on map -->
  <!-- Britain unit -->
  <circle cx="160" cy="150" r="12" fill="#cc3333" stroke="#fff" stroke-width="1.5"/>

  <!-- France unit -->
  <circle cx="280" cy="120" r="12" fill="#3366cc" stroke="#fff" stroke-width="1.5"/>

  <!-- Germany unit -->
  <circle cx="420" cy="140" r="12" fill="#33cc33" stroke="#fff" stroke-width="1.5"/>

  <!-- Russia unit -->
  <circle cx="850" cy="200" r="12" fill="#cc33cc" stroke="#fff" stroke-width="1.5"/>

  <!-- Right Panel -->
  <rect x="1040" y="70" width="335" height="810" fill="#6b4a2a" stroke="#3d2415" stroke-width="3"/>

  <!-- Panel Header -->
  <rect x="1040" y="70" width="335" height="30" fill="#9b7a5a" stroke="#3d2415" stroke-width="1"/>
  <text x="1207.5" y="90" font-family="Times New Roman" font-size="12" font-weight="bold" fill="#3d2415" text-anchor="middle">GREAT BRITAIN</text>

  <!-- Stats -->
  <g id="stats">
    <rect x="1050" y="110" width="315" height="20" fill="#3d2415" stroke="#8b6a4a" stroke-width="1"/>
    <text x="1060" y="125" font-family="Times New Roman" font-size="11" fill="#ffee99">Provinces: 9</text>

    <rect x="1050" y="135" width="315" height="20" fill="#3d2415" stroke="#8b6a4a" stroke-width="1"/>
    <text x="1060" y="150" font-family="Times New Roman" font-size="11" fill="#ffee99">Military: Excellent</text>

    <rect x="1050" y="160" width="315" height="20" fill="#3d2415" stroke="#8b6a4a" stroke-width="1"/>
    <text x="1060" y="175" font-family="Times New Roman" font-size="11" fill="#ffee99">Industry: Awesome</text>

    <rect x="1050" y="185" width="315" height="20" fill="#3d2415" stroke="#8b6a4a" stroke-width="1"/>
    <text x="1060" y="200" font-family="Times New Roman" font-size="11" fill="#ffee99">Population: 2,543,000</text>

    <rect x="1050" y="210" width="315" height="20" fill="#3d2415" stroke="#8b6a4a" stroke-width="1"/>
    <text x="1060" y="225" font-family="Times New Roman" font-size="11" fill="#ffee99">Workers: 890</text>
  </g>

  <!-- Province Info Box -->
  <rect x="1050" y="245" width="315" height="85" fill="#1a0a0a" stroke="#8b6a4a" stroke-width="1"/>
  <text x="1060" y="260" font-family="Times New Roman" font-size="11" font-weight="bold" fill="#ffee99">Selected: London</text>
  <text x="1060" y="280" font-family="Times New Roman" font-size="11" fill="#d4a574">Terrain: Grassland</text>
  <text x="1060" y="300" font-family="Times New Roman" font-size="11" fill="#d4a574">Population: 45,000</text>
  <text x="1060" y="320" font-family="Times New Roman" font-size="11" fill="#d4a574">Wheat: 245, Coal: 128, Iron: 89</text>

  <!-- Buttons -->
  <rect x="1050" y="345" width="148" height="25" fill="#9b7a5a" stroke="#d4a574" stroke-width="2"/>
  <text x="1124" y="361" font-family="Times New Roman" font-size="11" font-weight="bold" fill="#3d2415" text-anchor="middle">Build</text>

  <rect x="1207" y="345" width="158" height="25" fill="#9b7a5a" stroke="#d4a574" stroke-width="2"/>
  <text x="1286" y="361" font-family="Times New Roman" font-size="11" font-weight="bold" fill="#3d2415" text-anchor="middle">Select</text>

  <rect x="1050" y="380" width="315" height="25" fill="#9b7a5a" stroke="#d4a574" stroke-width="2"/>
  <text x="1207.5" y="396" font-family="Times New Roman" font-size="11" font-weight="bold" fill="#3d2415" text-anchor="middle">End Turn</text>

  <!-- Minimap -->
  <text x="1060" y="430" font-family="Times New Roman" font-size="11" font-weight="bold" fill="#d4a574">Minimap</text>
  <rect x="1050" y="440" width="315" height="200" fill="#000" stroke="#8b6a4a" stroke-width="2"/>

  <!-- Minimap tiles (simplified) -->
  <g id="minimap" opacity="0.8">
    <rect x="1055" y="445" width="9" height="9" fill="#0a3a0a"/>
    <rect x="1064" y="445" width="9" height="9" fill="#0a5a0a"/>
    <rect x="1073" y="445" width="9" height="9" fill="#0a3a0a"/>
    <rect x="1082" y="445" width="9" height="9" fill="#3a7a3a"/>
    <rect x="1091" y="445" width="9" height="9" fill="#8a8a8a"/>

    <rect x="1055" y="454" width="9" height="9" fill="#0a3a0a"/>
    <rect x="1064" y="454" width="9" height="9" fill="#3a7a3a"/>
    <rect x="1073" y="454" width="9" height="9" fill="#0a5a0a"/>
    <rect x="1082" y="454" width="9" height="9" fill="#3a7a3a"/>
    <rect x="1091" y="454" width="9" height="9" fill="#cc3333"/>

    <rect x="1055" y="463" width="9" height="9" fill="#0a1a3a"/>
    <rect x="1064" y="463" width="9" height="9" fill="#0a1a3a"/>
    <rect x="1073" y="463" width="9" height="9" fill="#3366cc"/>
    <rect x="1082" y="463" width="9" height="9" fill="#3a7a3a"/>
    <rect x="1091" y="463" width="9" height="9" fill="#0a5a0a"/>
  </g>

  <!-- Legend -->
  <text x="1060" y="670" font-family="Times New Roman" font-size="10" font-weight="bold" fill="#d4a574">Legend:</text>
  <circle cx="1065" cy="685" r="6" fill="#cc3333"/>
  <text x="1080" y="690" font-family="Times New Roman" font-size="10" fill="#daa">Britain</text>

  <circle cx="1065" cy="705" r="6" fill="#3366cc"/>
  <text x="1080" y="710" font-family="Times New Roman" font-size="10" fill="#daa">France</text>

  <circle cx="1065" cy="725" r="6" fill="#33cc33"/>
  <text x="1080" y="730" font-family="Times New Roman" font-size="10" fill="#daa">Germany</text>

  <circle cx="1065" cy="745" r="6" fill="#cc33cc"/>
  <text x="1080" y="750" font-family="Times New Roman" font-size="10" fill="#daa">Russia</text>
</svg>