name: finance_intelligence
description: "A new Flutter project for Finance Intelligence."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # HTTP Client & Interceptors
  dio: ^5.7.0

  # State Management & Dependency Injection
  flutter_riverpod: ^2.6.1

  # Data Models & Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  decimal: ^2.3.3
  uuid: ^4.5.1

  # File Picker for Financial Documents
  file_picker: ^8.1.7

  # Persistence Store
  shared_preferences: ^2.3.2
  crypto: ^3.0.3

  # Native Financial Chart Rendering
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true
