[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
pythonpath = . services/api
markers =
    unit: Fast unit tests without external dependencies
    integration: Integration tests requiring database or async framework
    contract: Wire contract schema validation tests
    live_acceptance: Live acceptance tests requiring external GCP/Firebase credentials

